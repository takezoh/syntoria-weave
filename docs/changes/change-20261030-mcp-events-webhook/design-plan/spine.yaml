acceptance:
- criteria: Given Real Node HTTP/MCP server, PostgreSQL and controlled HTTPS callback
    with a synthetic whsec_ secret. When Discover, list, subscribe twice with reordered
    argument keys, vary secret/TTL, wrong echo, timeout; unsubscribe twice and race
    unsubscribe with verification. Then Modern catalog/schema/envelopes correct; one
    active row and stable ID; bad proof does not activate; exact challenge header/body
    verified; finite TTL and null replay cursor; stale proof cannot win unsubscribe.
    Reject Activation before proof, duplicate rows, -32027 alias, replay claim, changed
    action revision.
  id: witness-wire-lifecycle
  requirement_refs:
  - req-discovery
  - req-subscription
  - req-security
  - req-integrity
- criteria: Given Two users, same client ID, two connections, and legacy resource
    subscribers. When Attempt cross-connection unsubscribe and forged public identity
    headers; call modern methods through 2025 negotiation; refresh with Gate outage.
    Then No foreign row changes; legacy resource streams and modern listen keep baseline
    behavior; no events advertised to legacy; outage is unknown rather than valid.
    Reject User chosen from arguments, revoked refresh, resource subscription regression.
  id: witness-wire-isolation
  requirement_refs:
  - req-discovery
  - req-subscription
  - req-security
  - req-integrity
- criteria: Given Real PostgreSQL, shared application writes and subscriptions for
    users A/B and connections X/Y. When Ask AI, approve, change linked Action, withdraw,
    reassign, reject stale CAS, roll back after task create, replay exact operation
    after lost response and Undo. Then Only relevant connection receives one persisted
    logical event per changed collaboration/revision; Action-path writes included;
    rollback and replay add no event; receipts and user scope preserved. Reject Events
    outside transaction, unrelated-user or unrelated-connection hints, lost withdrawal
    hint, event from rejected write.
  id: witness-atomic-selection
  requirement_refs:
  - req-meaning
  - req-recovery
  - req-idle
  - req-integrity
- criteria: Given Real PostgreSQL write transaction, controlled root wakeup adapter
    and fanout worker on a separate connection. When Run root wakeup before COMMIT,
    delay originating transaction beyond absence window, then commit or roll back.
    Separately terminate the server immediately after COMMIT without any later client
    request. Then Worker never classifies absence while origin lock is held; committed
    batch fans out; rolled-back batch never creates child deliveries; one confirmed
    root wakeup survives process exit. Reject Terminal absence result based only on
    elapsed time, waking from uncommitted row, requiring another request after confirmed
    enqueue.
  id: witness-wakeup-crash
  requirement_refs:
  - req-meaning
  - req-recovery
  - req-idle
  - req-integrity
- criteria: Given Root wakeup create times out or succeeds remotely with response
    lost. When Commit, stop process, then perform authenticated read or refresh; repeat
    recovery concurrently. Then Write succeeds and batch marker persists; next authenticated
    request retries exact root task name; bounded root-recovery batches converge;
    healthy fanout never waits for that recovery hook. Reject Failure of unrelated
    business write solely due to queue outage, duplicate event identity, scheduled
    scan, unconditional recovery claim during no-request outage.
  id: witness-enqueue-outage
  requirement_refs:
  - req-meaning
  - req-recovery
  - req-idle
  - req-integrity
- criteria: Given A healthy queue and valid subscriptions/affected collaborations
    produce substantially more than 20 deliveries, with child create latency such
    that all deliveries cannot fit in the old 3s write budget. Include concurrent
    duplicate root and continuation tasks. When Commit shared-path write, assert exactly
    one precommit create, terminate immediately after COMMIT and issue no further
    client request. Execute bounded task invocations; crash after child create before
    cursor persistence, after cursor persistence before continuation create, and after
    continuation create before result recording. Also fail successor enqueue once,
    then restore queue. Then Business write has the ordinary successful receipt without
    quota or fanout rejection; precommit create count remains one independent of membership
    size.; Every committed eligible row is eventually covered by an idempotently named
    delivery task through pages of at most20/8s and confirmed successors; no client
    request starts recovery.; No cursor advances past an unconfirmed row; no 2xx while
    remaining membership lacks a confirmed successor; failed/uncertain successor retains
    current task for retry.; Crashes and duplicate tasks resume contiguous progress;
    stable event IDs, terminal delivery behavior, revision/CAS and user isolation
    remain intact. Reject Healthy fanout overflow classified as queue outage, silent
    orphan, newly imposed subscription quota, rejection of otherwise valid business
    write, per-child precommit create, or future capacity measurement treated as workload
    enforcement.
  id: witness-batch-fanout
  requirement_refs:
  - req-meaning
  - req-recovery
  - req-idle
  - req-integrity
- criteria: Given Real Node HTTPS adapter with controllable resolver and certificate
    fixture. When Return public then private DNS answers, mixed A/AAAA, mapped IPv6,
    redirect to metadata address, proxy environment, bad TLS, stalled/oversize response.
    Then No socket reaches a nonpublic address; actual connected IP matches validated
    result; redirects never followed; bounds enforced. Reject Validation followed
    by independent fetch resolution, private reconnect, proxy bypass, sensitive diagnostic
    logging.
  id: witness-https-guard
  requirement_refs:
  - req-delivery
  - req-security
  - req-recovery
  - req-idle
- criteria: Given Known synthetic keys and captured exact HTTPS request bytes. When
    Challenge, normal send, retry, verified key rotation, invalid base64, payload
    at size limit and above. Then Independent Standard Webhooks verifier accepts exact
    bytes/header mapping; retry timestamp/signature fresh, body and ID stable; overlap
    carries both signatures only for 10m; oversize never sent. Reject Signing one
    serialization and sending another, stale timestamp, secret in logs/task/DB plaintext.
  id: witness-signature-bytes
  requirement_refs:
  - req-delivery
  - req-security
  - req-recovery
  - req-idle
- criteria: Given Pending rows and callback responses 200,410,413,400,408,429,503
    and disconnects. When Deliver concurrently, lose acknowledgment after callback
    accepts, crash before persisting result, advance injected clock past retry/lifetime
    bounds. Then One admitted concurrent send; stable eventId on possible retry duplicate;
    no retry after410/413; count/deadline bounds terminal; stopped/delivered rows
    acknowledge task. Reject Fresh ID after unknown result, unbounded retries or sends
    after observed expiry.
  id: witness-delivery-status
  requirement_refs:
  - req-delivery
  - req-security
  - req-recovery
  - req-idle
- criteria: Given Active subscription and delivery, Gate verifier with controllable
    responses. When Race unsubscribe/refresh/secret rotation with send admission;
    revoke Gate before next attempt; make Gate unavailable. Then Unsubscribe serializes
    after admitted send and prevents later sends; new attempt checks current generation/expiry
    and Gate; invalid stops exact connection; outage no send and no false revocation.
    Reject Post-unsubscribe new admission, stale secret/proof activation, cached Gate
    approval or cross-connection stop.
  id: witness-delivery-races
  requirement_refs:
  - req-delivery
  - req-security
  - req-recovery
  - req-idle
- criteria: Given Public Cloud Run-style HTTP surface and synthetic OIDC verifier.
    When Invoke internal endpoint with no token, business OAuth, spoofed task headers,
    wrong audience/account, then valid service token. Then Only configured task identity
    reaches delivery state/adapter. Reject Public internal route or Cloud Tasks header
    treated as authority.
  id: witness-task-auth
  requirement_refs:
  - req-delivery
  - req-security
  - req-recovery
  - req-idle
- criteria: Given Gate-side fixture and local Weave adapter using trusted resource
    credentials; two users/connections/resources. When Check active, expired, revoked,
    wrong user/client/resource, browser connection, removed account admission, unauthenticated
    caller, outage and malformed response. Then Only exact authorized OAuth connection
    returns true; invalid stops exact subscription; unknown prevents send and retains
    retry state. Reject ClientId-only validity, cross-resource enumeration, fail-open
    outage, positive cache.
  id: witness-gate-authority
  requirement_refs:
  - req-delivery
  - req-security
