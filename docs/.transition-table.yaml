# Status-transition allowlist for structured documents (dev-docs Skill).
# Copied to the project's docs/.transition-table.yaml by docs init.
# Edit this file to add status values for a project
# (the status enums in spec.schema.json and related schemas must also be updated).
#
# Format: kind: { from_status: [allowed_next_status, ...] }
# An empty array [] marks a terminal state (no further transitions).

adr:
  proposed:   [accepted, rejected]
  accepted:   [deprecated, superseded]
  rejected:   []
  deprecated: []
  superseded: []

change:
  draft:     [ready, abandoned]
  ready:     [active, abandoned]
  active:    [closing, abandoned]
  closing:   [active, done, abandoned]
  done:      []
  abandoned: []

plan:
  draft:     [active, abandoned]
  active:    [done, abandoned]
  done:      []
  abandoned: []

task:
  todo:        [in_progress, blocked, cancelled]
  in_progress: [blocked, done, cancelled]
  blocked:     [todo, in_progress, cancelled]
  done:        []
  cancelled:   []

spec:
  draft:       [approved]
  approved:    [implemented, obsolete]
  implemented: [obsolete]
  obsolete:    []

ux:
  draft:       [approved]
  approved:    [implemented, obsolete]
  implemented: [obsolete]
  obsolete:    []

note:
  draft:     [published, archived]
  published: [archived]
  archived:  []

issue:
  open:     [done, rejected]
  done:     []
  rejected: []

design:
  active:     [deprecated, superseded]
  deprecated: []
  superseded: []

component:
  active:     [deprecated, superseded]
  deprecated: []
  superseded: []
