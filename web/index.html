<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="layout-probe" content="layout-probe-2">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1d1e23" media="(prefers-color-scheme: dark)">
    <title>Actions</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
      :root {
        color-scheme: light dark;
        --shell-top-clearance: 0px;
        --shell-surface: light-dark(#fff, #1d1e23);
        background: var(--shell-surface);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui;
        color-scheme: light dark;
        background: var(--shell-surface);
      }

      body {
        box-sizing: border-box;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        padding-top: calc(env(safe-area-inset-top) + var(--shell-top-clearance));
      }

      #top-clearance-band {
        position: fixed;
        z-index: 1;
        top: 0;
        right: 0;
        left: 0;
        height: calc(env(safe-area-inset-top) + var(--shell-top-clearance));
        display: none;
        background: var(--shell-surface);
        pointer-events: none;
      }

      @supports (-webkit-touch-callout: none) {
        @media (display-mode: standalone) and (orientation: portrait), (display-mode: fullscreen) and (orientation: portrait) {
          :root {
            --shell-top-clearance: 20px;
          }

          #top-clearance-band {
            display: block;
          }
        }

        @media (orientation: portrait) {
          :root[data-home-screen="true"] {
            --shell-top-clearance: 20px;
          }

          :root[data-home-screen="true"] #top-clearance-band {
            display: block;
          }
        }
      }

      #access {
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #access[hidden],
      #message[hidden],
      #workspace[hidden],
      button[hidden] {
        display: none;
      }

      #workspace {
        width: 100%;
        flex: 1;
        min-height: 0;
        border: 0;
      }

      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        visibility: hidden;
        pointer-events: none;
      }

      #display-info-d1-button {
        position: fixed;
        z-index: 3;
        left: calc(env(safe-area-inset-left, 0px) + 8px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        max-width: calc(100vw - 16px);
        padding: 4px 8px;
        font-size: 12px;
        opacity: 0.88;
      }

      #display-info-d1-dialog {
        position: fixed;
        z-index: 10;
        inset: 0;
        margin: auto;
        box-sizing: border-box;
        width: min(34rem, calc(100vw - 24px));
        max-width: calc(100vw - 24px);
        max-height: calc(100dvh - 24px);
        overflow: auto;
        border: 1px solid #777;
        border-radius: 8px;
        padding: 16px;
        color: CanvasText;
        background: Canvas;
      }

      #display-info-d1-dialog::backdrop {
        background: rgb(0 0 0 / 45%);
      }

      #display-info-d1-report {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        font: 12px/1.45 ui-monospace, monospace;
      }

      button {
        font: inherit;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <div id="top-clearance-band" aria-hidden="true"></div>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <header id="access">
      <span id="message">Loading session…</span>
      <button id="login" hidden>Sign in</button>
      <button id="retry" hidden>Try again</button>
      <button id="logout" hidden>Sign out this device</button>
    </header>
    <iframe id="workspace" title="Actions" hidden></iframe>
    <button id="display-info-d1-button" type="button" aria-haspopup="dialog" aria-controls="display-info-d1-dialog">Display info D1</button>
    <dialog id="display-info-d1-dialog" aria-labelledby="display-info-d1-title" aria-modal="true">
      <h1 id="display-info-d1-title">Display info D1</h1>
      <button id="display-info-d1-close" type="button">Close</button>
      <pre id="display-info-d1-report" aria-live="polite"></pre>
    </dialog>
    <script type="module" src="/client.ts"></script>
  </body>
</html>
