<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#19191c" media="(prefers-color-scheme: dark)">
    <title>Actions</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
      :root {
        color-scheme: light dark;
        background: light-dark(#fff, #19191c);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui;
        color-scheme: light dark;
        background: light-dark(#fff, #19191c);
      }

      body {
        box-sizing: border-box;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      #access {
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #access[hidden],
      #message[hidden],
      #workspace[hidden],
      button[hidden] {
        display: none;
      }

      #workspace {
        width: 100%;
        flex: 1;
        min-height: 0;
        border: 0;
      }

      button {
        font: inherit;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body>
    <header id="access">
      <span id="message">Loading session…</span>
      <button id="login" hidden>Sign in</button>
      <button id="retry" hidden>Try again</button>
      <button id="logout" hidden>Sign out this device</button>
    </header>
    <iframe id="workspace" title="Actions" hidden></iframe>
    <script type="module" src="/client.ts"></script>
  </body>
</html>
